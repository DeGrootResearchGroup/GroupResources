project:
  type: website
  output-dir: _site
  # Rebuilds the downloadable template zip from templates/presentation/ before
  # every render/preview, so it can't go stale. See the script for why.
  pre-render: scripts/build_presentation_template_zip.py
  # Only .qmd files are site pages; README.md, CONTRIBUTING.md etc. are repository docs.
  render:
    - "*.qmd"
    - "**/*.qmd"
    # The presentation template is a standalone revealjs starter (rendered and
    # shared on its own), not a knowledge-base page — keep it out of the site.
    - "!templates/"

website:
  title: "DeGroot Research Group Resources"
  description: "Public knowledge base for the DeGroot Research Group at Western University."
  site-url: https://degrootresearchgroup.github.io/GroupResources/
  repo-url: https://github.com/DeGrootResearchGroup/GroupResources
  repo-actions: [edit, source, issue]
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Theory
        href: theory/index.qmd
      - text: Software
        href: software/index.qmd
      - text: OpenFOAM
        href: openfoam/index.qmd
      - text: Project Management
        href: project-management/index.qmd
      - text: Policies
        href: policies/index.qmd
    right:
      - icon: github
        href: https://github.com/DeGrootResearchGroup/GroupResources
        aria-label: GitHub repository
  # One auto-generated sidebar per section: new pages appear without editing this file.
  sidebar:
    - title: "Theory"
      contents: theory
    - title: "Software"
      contents: software
    - title: "OpenFOAM"
      contents: openfoam
    - title: "Project Management"
      contents: project-management
    - title: "Policies"
      contents: policies
  page-footer:
    left: "Content licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/). Code licensed MIT."
    right: "DeGroot Research Group, Western University"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    code-copy: true
    html-math-method: katex

execute:
  # Re-execute code cells only when a page's source changes. The _freeze/ directory is committed.
  freeze: auto
